name: update-feed

on:
  schedule:
    # UTC 时间；对应北京时间 06:10 / 18:10
    - cron: "10 22 * * *"
    - cron: "10 10 * * *"
  workflow_dispatch:        # 支持在 Actions 页面手动触发

permissions:
  contents: write           # 需要把 data/ 与 site/ 提交回仓库
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取 + 翻译 + 生成页面
        env:
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
        run: python src/run.py

      - name: 提交数据变更
        run: |
          git config user.name "lit-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          if git diff --staged --quiet; then
            echo "没有新内容，跳过提交"
          else
            git commit -m "chore: 更新文献速递 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: 写入运行摘要
        run: |
          python - <<'EOF' >> $GITHUB_STEP_SUMMARY
          import json, pathlib
          d = json.loads(pathlib.Path("data/papers.json").read_text(encoding="utf-8"))
          ps = d["papers"]
          zh = sum(1 for p in ps if p.get("zh"))
          import collections
          c = collections.Counter(p["j"] for p in ps)
          print("### 本次更新\n")
          print(f"- 条目总数：**{len(ps)}**")
          print(f"- 有中文标题：{zh}（其余靠后续运行续译）")
          print("- 分刊：" + "、".join(f"{k} {v}" for k, v in c.most_common()))
          EOF

      - uses: actions/configure-pages@v5
        with:
          enablement: true        # 仓库没开 Pages 时自动开启（Source 会自动设成 GitHub Actions）

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
