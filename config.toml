# ═══════════════════════════════════════════════════════════════
#  lit-radar 配置 · 改完直接重新运行 python src/run.py 即可
# ═══════════════════════════════════════════════════════════════

[site]
title = "ChemRadar"
subtitle = "计算化学文献速递 · latest computational chemistry papers"
window_days = 14     # 每次抓取回溯多少天（首次运行会把这段窗口全抓下来）
keep_days = 90       # data/papers.json 里保留多久的历史，超出即丢弃

[fetch]
# 建议填你的邮箱：Crossref 会把你放进 polite pool，响应更快也更少被限流
mailto = "you@example.com"
rows = 500           # 每个期刊单次请求条数（Crossref 上限 1000）

# arXiv 预印本源：抓 physics.chem-ph 的近期预印本
arxiv = true
arxiv_categories = ["physics.chem-ph"]

[filter]
# 期刊前置内容不是研究论文，默认剔除。下面是从实际数据里归纳出来的标题形态，
# 想保留某类（比如封面）就从列表里删掉对应那一行。
drop_titles = [
  '^(issue\s+)?(editorial\s+)?masthead$',
  'issue\s+publication\s+information',
  '^issue\s+information$',
  '^(inside\s+)?(front|back)\s+cover$',
  '^contents\s+list$',
  '^table\s+of\s+contents$',
  '^in\s+this\s+issue$',
  '^front\s+matter$',
]
# 无作者且无摘要的条目一律视为非研究内容（前置内容几乎都长这样）
drop_anonymous = true

[translate]
backend = "mymemory"       # mymemory | none
email = ""                 # 填邮箱后额度从 5000 → 50000 字符/天（强烈建议填）
lang = "zh-CN"
max_chars_per_run = 0      # 0 = 自动：有 email 用 45000，没有则 4500；也可手填上限
# 只翻标题，日常一天 40 篇标题约 4500 字符，正落在免费额度内

# ── 期刊清单（想增减直接改这一段，ISSN 可在 crossref.org 上查）───────
